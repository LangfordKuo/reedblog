name: Docker

# 触发：
#   - push tag v*       → 构建 linux/amd64 + linux/arm64 并推 GHCR（vX.Y.Z / X.Y / latest / sha-<短sha>）
#   - push main / PR     → 只构建校验，不推送
#   - workflow_dispatch  → 手动触发（同上：只有 tag ref 才推送）
#
# 后端镜像的构建路径：binaries job 先在 runner 上编出两个架构的二进制（amd64 原生 / arm64 交叉），
# build job 再用 deploy/docker/Dockerfile.runtime 组装镜像——不在 QEMU 里跑 cargo，后端构建从
# 三十多分钟降到几分钟（详见 binaries job 上方注释）。web 镜像维持原样（node 构建，双架构 ~4 分钟）。
on:
  push:
    branches: [main]
    tags: ["v*"]
    # 路径过滤只对分支推送生效；GitHub 对 tag 推送不评估 paths（tag 一定触发）
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/docker/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/docker/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一 ref（尤其同一 tag）串行，避免两个运行并发写同一组镜像 tag
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 关键提速点：在 runner 上原生/交叉编译两个架构的二进制，交给 build job 组装进镜像。
  #   - 原路线（buildx 在 QEMU 里 cargo build）arm64 全量模拟，一次 ~36 分钟；
  #   - 现在 amd64 原生编、arm64 用 apt 交叉工具链（与 release.yml 已验证的做法逐项一致），
  #     Swatinem/rust-cache 缓存 backend/target 跨运行复用，改前端或复用缓存时几乎只剩增量编译。
  binaries:
    name: Build backend binaries (amd64 + arm64)
    # 固定 22.04（glibc 2.35）而不是 ubuntu-latest（24.04 / glibc 2.39）：
    # 运行时基础镜像是 debian:bookworm-slim（glibc 2.36），在新 glibc 上编出的二进制可能引用
    # GLIBC_2.38/2.39 符号，进容器直接起不来。release.yml 的 Linux 产物同样固定在 22.04。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # x86_64 是 runner 原生目标；aarch64 需要显式安装 std
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # $workspace -> $target；实际缓存 backend/target（两个 target 的产物都在其下，一次缓存共用）
          workspaces: "backend -> target"
          # 与 release.yml 的 key 区分开，避免两条流水线互顶缓存
          key: docker-backend-binaries

      # aarch64 交叉编译：bundled SQLite 等 C 代码也要用交叉 gcc/ar（同 release.yml）
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binaries (release, locked)
        working-directory: backend
        env:
          # 只对 aarch64 目标生效；x86_64 原生构建忽略这几个变量
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          cargo build --release --locked --target aarch64-unknown-linux-gnu

      # 摆成 Dockerfile.runtime 认的 prebuilt/<TARGETARCH>/ 布局，并自检架构（防止交叉工具链没生效编出 x86 产物）
      - name: Stage binaries for image assembly
        run: |
          set -euo pipefail
          mkdir -p prebuilt/amd64 prebuilt/arm64
          cp backend/target/x86_64-unknown-linux-gnu/release/reedblog-backend prebuilt/amd64/reedblog-backend
          cp backend/target/aarch64-unknown-linux-gnu/release/reedblog-backend prebuilt/arm64/reedblog-backend
          file prebuilt/amd64/reedblog-backend prebuilt/arm64/reedblog-backend
          file prebuilt/amd64/reedblog-backend | grep -q 'x86-64' || { echo "架构自检失败：amd64 产物不是 x86-64"; exit 1; }
          file prebuilt/arm64/reedblog-backend | grep -q 'aarch64' || { echo "架构自检失败：arm64 产物不是 aarch64"; exit 1; }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          # 上传两个具体文件：artifact 内保留 amd64/、arm64/ 两级目录（下载到 prebuilt/ 后路径即可用）
          path: |
            prebuilt/amd64/reedblog-backend
            prebuilt/arm64/reedblog-backend
          retention-days: 3
          if-no-files-found: error

  build:
    name: Build ${{ matrix.image }} (amd64 + arm64)
    runs-on: ubuntu-latest
    # backend 需要 binaries 的产物；web 也一起等（job 级 needs 无法只对矩阵一项生效）
    needs: [binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            # CI 快路径：二进制已由 binaries job 编好，只做运行时组装
            file: deploy/docker/Dockerfile.runtime
          - image: web
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # 下载到 prebuilt/，正好对上 Dockerfile.runtime 的 COPY prebuilt/${TARGETARCH}/...
      - name: Download backend binaries
        if: matrix.image == 'backend'
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: prebuilt

      # QEMU 仍要装：arm64 那条 runtime 阶段里的 apt-get 是在模拟架构下执行的。
      # 但相比原来在 QEMU 里全量 cargo build，这里只剩装包和拷二进制，分钟级。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 只在 tag 构建时登录（main/PR 不推送，无需凭据）
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/langfordkuo/reedblog-${{ matrix.image }}
          # latest 不用自动规则（避免 main 分支构建也打 latest），只在 tag 时显式加
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 不产出 attestation 清单，保持镜像 manifest 简单（老客户端也能直接 pull）
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # 单架构 load 构建后在 runner 上真跑一遍：后端未安装态 503 → 安装 201；web 静态 200 + /api 反代可达。
  # 这是「镜像真能启动」的唯一自动化验证（多架构构建本身只证明能编译）。
  # 后端同样用 binaries job 的 amd64 产物组装（冒烟里不再跑 cargo），断言与原来完全一致。
  smoke:
    name: Smoke test (backend + web, amd64)
    runs-on: ubuntu-latest
    needs: [binaries]
    steps:
      - uses: actions/checkout@v4

      - name: Download backend binaries
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: prebuilt

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images for smoke (amd64, --load)
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --cache-from type=gha,scope=backend \
            -t reedblog-backend:smoke -f deploy/docker/Dockerfile.runtime .
          docker buildx build --load --platform linux/amd64 \
            --cache-from type=gha,scope=web \
            -t reedblog-web:smoke -f frontend/Dockerfile .

      - name: Smoke test containers
        run: |
          set -euo pipefail

          BACKEND_CT=reedblog-smoke-backend
          BACKEND2_CT=reedblog-smoke-backend-web
          WEB_CT=reedblog-smoke-web
          NET=reedblog-smoke-net

          dump_logs() {
            echo "===== 失败诊断：容器日志 ====="
            for c in "$BACKEND_CT" "$BACKEND2_CT" "$WEB_CT"; do
              if docker inspect "$c" >/dev/null 2>&1; then
                echo "----- docker logs $c -----"
                docker logs "$c" 2>&1 || true
              fi
            done
            echo "=============================="
          }
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then dump_logs; fi
            docker rm -f "$BACKEND_CT" "$BACKEND2_CT" "$WEB_CT" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
            docker volume rm reedblog-smoke-data reedblog-smoke-data2 >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          # 轮询等待 URL 可连（返回 000 说明还没起来）
          wait_http() {
            url="$1"
            for _ in $(seq 1 60); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
              if [ -n "$code" ] && [ "$code" != "000" ]; then return 0; fi
              sleep 1
            done
            echo "等待超时: $url"
            return 1
          }

          # 轮询等待 URL 返回期望状态码之一（用于「反代链路两端都就绪」的判定）
          wait_code() {
            url="$1"
            shift
            for _ in $(seq 1 60); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
              for want in "$@"; do
                if [ "$code" = "$want" ]; then return 0; fi
              done
              sleep 1
            done
            echo "等待超时: $url（最后一次状态码 $code，期望 $*）"
            return 1
          }

          # ---------- 1) 后端：未安装态 503 → 安装 201 ----------
          docker network create "$NET" >/dev/null
          docker volume create reedblog-smoke-data >/dev/null
          docker run -d --name "$BACKEND_CT" --network "$NET" --network-alias backend \
            -p 127.0.0.1:3010:3000 -v reedblog-smoke-data:/data reedblog-backend:smoke

          wait_http http://127.0.0.1:3010/api/site/settings
          code="$(curl -s -o /tmp/reedblog-settings.json -w '%{http_code}' http://127.0.0.1:3010/api/site/settings)"
          echo "未安装态 GET /api/site/settings -> $code（期望 503）body=$(cat /tmp/reedblog-settings.json)"
          [ "$code" = "503" ] || { echo "冒烟失败：期望 503(not_installed)，实际 $code"; exit 1; }

          code="$(curl -s -o /tmp/reedblog-install.json -w '%{http_code}' -X POST \
            http://127.0.0.1:3010/api/install -H 'Content-Type: application/json' \
            -d '{"db_type":"sqlite","sqlite_path":"/data/reedblog.db","site":{"title":"smoke"},"admin":{"username":"admin","password":"smoke-password-123"}}')"
          echo "POST /api/install -> $code（期望 201）body=$(cat /tmp/reedblog-install.json)"
          [ "$code" = "201" ] || { echo "冒烟失败：安装期望 201，实际 $code"; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3010/api/site/settings)"
          echo "已安装 GET /api/site/settings -> $code（期望 200）"
          [ "$code" = "200" ] || { echo "冒烟失败：安装后期望 200，实际 $code"; exit 1; }

          # 安装结果落到数据卷（config.toml + SQLite）——容器重启后仍在
          docker stop "$BACKEND_CT" >/dev/null
          docker rm "$BACKEND_CT" >/dev/null

          # ---------- 2) Web：静态 200 + /api 反代 + UA 分流 ----------
          # 重新起一个未安装态后端（同网络、服务别名 backend），验证 web 镜像的反代与分流
          docker volume create reedblog-smoke-data2 >/dev/null
          docker run -d --name "$BACKEND2_CT" --network "$NET" --network-alias backend \
            -v reedblog-smoke-data2:/data reedblog-backend:smoke
          docker run -d --name "$WEB_CT" --network "$NET" -p 127.0.0.1:8080:80 \
            -e BACKEND_UPSTREAM=backend:3000 reedblog-web:smoke

          wait_http http://127.0.0.1:8080/
          # 反代链路就绪：后端未安装态经 Nginx 返回 503（排除 502=后端还没起来）
          wait_code http://127.0.0.1:8080/api/site/settings 503 200

          body="$(curl -s http://127.0.0.1:8080/)"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          echo "GET / -> $code；index.html 标记: $(printf '%s' "$body" | grep -c 'id=\"root\"')"
          [ "$code" = "200" ] || { echo "冒烟失败：web 首页期望 200，实际 $code"; exit 1; }
          printf '%s' "$body" | grep -q 'id="root"' || { echo "冒烟失败：首页不是构建后的 index.html"; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/site/settings)"
          echo "经反代 GET /api/site/settings -> $code（后端未安装态，期望 503；200 也算通过）"
          { [ "$code" = "503" ] || [ "$code" = "200" ]; } || { echo "冒烟失败：/api 反代不可达（$code）"; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/robots.txt)"
          echo "经反代 GET /robots.txt -> $code（期望 200/503 之外仍是后端响应，非静态 404）"
          [ "$code" != "404" ] || { echo "冒烟失败：/robots.txt 未反代到后端"; exit 1; }

          human="$(curl -s -o /tmp/reedblog-human.html -w '%{http_code}' \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0' http://127.0.0.1:8080/posts/smoke)"
          echo "真人 UA GET /posts/smoke -> $human（期望 200 SPA）"
          [ "$human" = "200" ] || { echo "冒烟失败：真人流量应拿 SPA，实际 $human"; exit 1; }
          grep -q 'id="root"' /tmp/reedblog-human.html || { echo "冒烟失败：真人流量不是 SPA index.html"; exit 1; }

          bot="$(curl -s -o /tmp/reedblog-bot.html -w '%{http_code}' \
            -A 'Twitterbot/1.0' http://127.0.0.1:8080/posts/smoke)"
          echo "爬虫 UA GET /posts/smoke -> $bot（未安装后端，期望 503 且不是 SPA）"
          [ "$bot" = "503" ] || { echo "冒烟失败：爬虫应被分流到后端（期望 503），实际 $bot"; exit 1; }
          grep -q 'id="root"' /tmp/reedblog-bot.html && { echo "冒烟失败：爬虫拿到了 SPA（UA 分流失效）"; exit 1; }

          echo "✅ 冒烟测试全部通过"
