name: Release

# 打 tag（v*）→ 构建三平台产物并发布 GitHub Release
# 手动触发（workflow_dispatch）→ 只构建、产物留在本次运行的 Artifacts，不发 Release（安全的试跑通道）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动构建用的版本号（仅用于产物命名，不会发布 Release）"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

# 同一 tag/分支的重复触发排队执行，避免两个 Release 并发写
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Build frontend (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build:
    name: Build ${{ matrix.asset }}
    needs: [prepare, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: x86_64-linux
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            asset: aarch64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: x86_64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # $workspace -> $target；target 相对 workspace 解析，实际缓存 backend/target
          workspaces: "backend -> target"
          key: ${{ matrix.target }}

      # aarch64 交叉编译：bundled SQLite 等 C 代码也要用交叉 gcc/ar
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (release)
        working-directory: backend
        env:
          # 只对 aarch64 目标生效，其它目标忽略这两个变量
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: backend
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/reedblog-backend"
          file "$bin"
          # 只有 x86_64 能在 runner 上原生跑；aarch64 走 QEMU 会拖慢流程，故只校验架构
          if [ "$TARGET" != "x86_64-unknown-linux-gnu" ]; then
            echo "非原生目标，跳过运行冒烟（架构已由 file 校验）"
            exit 0
          fi
          smoke="$(mktemp -d)"
          cp "$bin" "${smoke}/reedblog-backend"
          cat > "${smoke}/config.toml" <<'EOF'
          [server]
          host = "127.0.0.1"
          port = 3010
          base_url = ""

          [database]
          db_type = "sqlite"
          sqlite_path = "reedblog.db"

          [site]
          title = "smoke"

          [cors]
          allowed_origins = []

          [plugins]
          dir = "plugins"

          [themes]
          dir = "themes"
          active = "default"

          [uploads]
          dir = "uploads"
          max_size_mb = 10
          EOF
          ( cd "$smoke" && exec ./reedblog-backend > serve.log 2>&1 ) &
          srv=$!
          code=""
          for _ in $(seq 1 40); do
            code="$(curl -s -o /tmp/smoke_body -w '%{http_code}' http://127.0.0.1:3010/api/site/settings || true)"
            if [ -n "$code" ] && [ "$code" != "000" ]; then break; fi
            sleep 0.5
          done
          echo "GET /api/site/settings -> $code $(cat /tmp/smoke_body 2>/dev/null || true)"
          kill "$srv" 2>/dev/null || true
          [ "$code" = "503" ] || { echo "冒烟失败：期望 503(not_installed)，实际 $code"; cat "${smoke}/serve.log"; exit 1; }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          name="reedblog-${VERSION}-${ASSET}"
          mkdir -p "pkg/${name}/deploy"
          cp "backend/target/${TARGET}/release/reedblog-backend" "pkg/${name}/"
          cp -r frontend/dist "pkg/${name}/frontend-dist"
          cp deploy/nginx.conf.example "pkg/${name}/deploy/"
          cp deploy/QUICKSTART.md README.md README.en.md "pkg/${name}/"
          printf 'name: reedblog\nversion: %s\ntarget: %s\nbuilt_at_utc: %s\ngit: %s (%s)\n' \
            "$VERSION" "$TARGET" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" \
            > "pkg/${name}/VERSION.txt"
          chmod +x "pkg/${name}/reedblog-backend"
          tar -czf "${name}.tar.gz" -C pkg "${name}"
          echo "--- 包内容 ---"
          tar -tzf "${name}.tar.gz"
          ls -lh "${name}.tar.gz"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          $name = "reedblog-$env:VERSION-$env:ASSET"
          New-Item -ItemType Directory -Force -Path "pkg/$name/deploy" | Out-Null
          Copy-Item "backend/target/$env:TARGET/release/reedblog-backend.exe" "pkg/$name/"
          Copy-Item -Recurse "frontend/dist" "pkg/$name/frontend-dist"
          Copy-Item "deploy/nginx.conf.example" "pkg/$name/deploy/"
          Copy-Item "deploy/QUICKSTART.md","README.md","README.en.md" "pkg/$name/"
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          @(
            "name: reedblog"
            "version: $env:VERSION"
            "target: $env:TARGET"
            "built_at_utc: $stamp"
            "git: $env:GITHUB_REF_NAME ($($env:GITHUB_SHA.Substring(0,7)))"
          ) | Set-Content -Encoding UTF8 "pkg/$name/VERSION.txt"
          Compress-Archive -Path "pkg/$name/*" -DestinationPath "$name.zip"
          Get-ChildItem "$name.zip" | Select-Object Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.asset }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt
          echo "--- 发布结果 ---"
          gh release view "$GITHUB_REF_NAME" --json tagName,name,isDraft,isPrerelease,assets \
            -q '"\(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease)"' 
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[] | "\(.name)  \(.size) bytes"'
